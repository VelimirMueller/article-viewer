# The repo has no package.json and no build step: CI checks the JavaScript syntax,
# the JSON files and that the nginx image serves the page and the article data.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every action is pinned to the commit of the named release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: JavaScript syntax
        run: git ls-files -z 'js/*.js' | xargs -0 -n1 node --check
      - name: JSON parses
        run: git ls-files -z '*.json' | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'
      - name: Docker image serves the page
        run: |
          docker build -t article-viewer:ci .
          docker run -d --name av -p 8080:80 article-viewer:ci
          trap 'docker rm -f av >/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8080/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs av; echo "nginx did not answer in 20 s"; exit 1; fi
          curl -fsS http://localhost:8080/ | grep -q '<script type="module"'
          curl -fsS http://localhost:8080/data/articles.json | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'
